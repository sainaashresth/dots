# foot.ini — matches Hyprland/Waybar theme (#1b1b1e bg, #cdd6f4 fg, #33ccff accent)

[main]
font=JetBrainsMono Nerd Font:size=11
pad=16x16

[cursor]
style=beam
blink=yes

[scrollback]
lines=1000

[colors-dark]
background=1b1b1e
foreground=cdd6f4
regular0=1b1b1e
regular1=ff5555
regular2=00ff99
regular3=ffcc66
regular4=33ccff
regular5=c8aaff
regular6=89ddff
regular7=cdd6f4
bright0=6c7086
bright1=ff5555
bright2=00ff99
bright3=ffcc66
bright4=33ccff
bright5=c8aaff
bright6=89ddff
bright7=e6e9f0
selection-foreground=1b1b1e
selection-background=33ccff
cursor=1b1b1e 33ccff

# --- aesthetic ---
alpha=0.7
alpha-mode=default
blur=yes
